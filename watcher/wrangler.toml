# The shift watcher runs beside the Pages project, not inside it: Pages
# Functions have no cron triggers, so anything that has to happen when nobody
# is looking at a screen lives here.
#
# It binds the same D1 database the app uses. It reads two tables and writes
# one, and it can decrypt nothing — the reports are sealed with a key that
# only the admin's browser holds.
name = "tzayad-watch"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Four times an hour. The handover times themselves are not in here — they are
# set per mission in the console, so adding a patrol is a field in the app and
# never a redeploy.
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tzayad"
database_id = "2da039e5-6258-485a-b1bc-0353006db54e"

[vars]
META_GRAPH_API_VERSION = "v26.0"
# Set this to a UTILITY-category template once one is approved. Marketing
# templates are rate-limited per recipient and silently dropped over the cap,
# which is what swallowed a full day of alerts.
WA_TPL_ALERT = "tzayad_shift"
# The name before the sentence, and empty on purpose.
#
# tzayad_update's body is "שלום {{1}}, {{2}}", so it prints a greeting whatever
# goes here. tzayad_shift takes the sentence alone and greets nobody, which is
# what was asked for — and being UTILITY rather than MARKETING it is also not
# subject to the per-recipient cap that silently swallowed the first attempt.
#
# Empty selects the one-parameter shape. Meta refuses a message whose parameter
# count does not match the template exactly, so this and WA_TPL_ALERT have to
# change together.
WA_TPL_LEAD = ""
WA_TPL_UPDATE = "tzayad_update"
WA_TPL_LANG = "he"
WHATSAPP_PHONE_NUMBER_ID = "1216224748249995"

# The sentence that goes out. {mission} and {time} are filled in.
# Editable from the Cloudflare dashboard without a deploy, which is the point
# — the wording is the thing somebody wants to change in the evening.
ALERT_TEXT = "לא התקבל דוח משמרת מ{mission} למשמרת של {time}"

# The last day this sends anything. From the 31st it goes quiet on its own —
# both the digests and the missed-handover alerts. Clear it to run indefinitely.
STOP_AFTER = "2026-10-30"

# How late a report may be before anybody is woken up, how far back a restart
# looks, and how early a report still counts for the handover it precedes.
ALERT_GRACE_MIN = "30"
ALERT_WINDOW_HOURS = "6"
ALERT_EARLY_MIN = "60"

# ALERT_TO, WHATSAPP_ACCESS_TOKEN and WATCH_KEY are secrets, set with
# `wrangler secret put` — phone numbers are personal data and this repository
# is public.
#
# WHATSAPP_ACCESS_TOKEN is deliberately the same name the Pages project uses
# for the same Meta token. Two names for one credential is how one of them
# ends up rotated and the other quietly stops working.
