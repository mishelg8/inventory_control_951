name = "tzayad"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "tzayad"
database_id = "2da039e5-6258-485a-b1bc-0353006db54e"

# The WhatsApp service (GREEN-API). The instance id and its host are not
# secrets — they identify which instance, and the API refuses every call that
# does not also carry the token. The token itself is an encrypted secret set
# with `wrangler pages secret put GREEN_TOKEN`, and it must never appear here.
#
# With any of the three missing the console says so plainly and the wa.me
# buttons keep working, which is the state this project was in before and the
# state it falls back to.
[vars]
GREEN_API_URL = "https://7107.api.greenapi.com"
GREEN_ID = "710722713591"

# How fast the line is allowed to send. WhatsApp has now restricted this
# number twice: the first time for approving twenty rows at once and firing
# twenty first-contact messages inside a few seconds, the second time on
# 19.8.2026 for a single message sent minutes after re-linking a fresh
# instance — six hours, and the account could not open a new chat by hand
# either. A number with that history is not a number to send bursts from.
#
# These are the provider's own figures for a number that is new or has just
# been restricted: at most one message a minute, at most twenty new contacts
# in a day. The server holds the floors, not the browser, so a reload or a
# second tab cannot reset them.
#
# Raising them is a decision, not a default. Give the number weeks of quiet
# ordinary use first — the counters below are the last thing standing between
# a busy morning and a third restriction. Refusals fall back to the wa.me
# buttons, which is not a failure: the chat opens on the sender's own phone.
WA_GAP_MS = "60000"
WA_HOUR_MAX = "10"
WA_DAY_MAX = "20"
