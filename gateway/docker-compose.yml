services:
  gateway:
    build: .
    image: tzayad-whatsapp-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      # Pinned here and not left to the image. `env_file` overrides a Dockerfile
      # ENV, so the blank line that .env.example used to carry silently undid
      # the path the image sets — and puppeteer went looking for a copy of
      # Chrome it had been told never to download. The failure surfaces only on
      # connect, as "Could not find Chrome", long after the container reports
      # itself healthy. `environment` beats `env_file`, so this wins whatever
      # the .env says.
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      # Bound to loopback. Put a tunnel or a reverse proxy in front of it —
      # this service should not be the thing facing the internet.
      - "127.0.0.1:3000:3000"
    volumes:
      # The WhatsApp session and the queue. Lose this and the number has to be
      # scanned again, so it is a named volume, not a container layer.
      - gateway-data:/data
    # Chromium spawns its renderer in a sandbox that needs this; without it
    # the browser dies on start with an error that names nothing useful.
    security_opt:
      - seccomp:unconfined
    # Chromium's default /dev/shm is 64 MB in Docker and it will crash on it.
    shm_size: "512mb"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  gateway-data:
